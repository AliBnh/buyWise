# ==============================================================================================
# NGINX PRODUCTION REVERSE PROXY & SPA STATIC SERVER
# ==============================================================================================
# ARCHITECTURAL DESIGN & ENGINEERING RATIONALE:
#
# 1. SPA CLIENT-SIDE ROUTING FALLBACK:
#    - try_files $uri $uri/ /index.html;
#    - In single page applications (React Router), URLs like /comparisons/12 or /dashboard
#      do not exist as physical files on disk. Nginx intercepts these paths and serves index.html,
#      allowing the client-side JavaScript engine to render the correct view without 404 errors.
#
# 2. INTERNAL API REVERSE PROXY & CORS ELIMINATION:
#    - Requests matching /api/ are proxied to http://backend:8080/api/.
#    - Because both frontend and backend share the same public domain / port via Nginx,
#      browser Same-Origin Policy (SOP) is satisfied and cross-origin preflight requests (OPTIONS)
#      are minimized.
#
# 3. GZIP COMPRESSION & STATIC CACHING:
#    - Gzip compresses text, CSS, JS, and JSON payloads over 1024 bytes, reducing bandwidth by ~70%.
#    - Hashed static assets (Vite dist files) are cached with Cache-Control "public, max-age=31536000, immutable".
# ==============================================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root directory containing compiled React static assets from Docker build stage
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ------------------------------------------------------------------------------------------
    # GZIP COMPRESSION (Bandwidth Optimization)
    # ------------------------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------------------------------
    # REVERSE PROXY: Spring Boot REST API
    # ------------------------------------------------------------------------------------------
    location /api/ {
        # Forward traffic to the backend container over internal Docker network
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        client_max_body_size 15M;
    }

    # ------------------------------------------------------------------------------------------
    # REVERSE PROXY: Swagger UI Documentation & OpenAPI Spec
    # ------------------------------------------------------------------------------------------
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    # ------------------------------------------------------------------------------------------
    # SPA HTML5 HISTORY ROUTING
    # ------------------------------------------------------------------------------------------
    location / {
        # First attempt to serve file directly, then directory, then fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------------------------------
    # LONG-TERM CACHING FOR HASHED STATIC ASSETS
    # ------------------------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------------------------
    # SECURITY HEADERS
    # ------------------------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
