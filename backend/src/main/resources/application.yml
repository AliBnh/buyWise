server:
  port: ${PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always

spring:
  application:
    name: buywise-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/buywise}
    username: ${SPRING_DATASOURCE_USERNAME:buywise}
    password: ${SPRING_DATASOURCE_PASSWORD:buywise}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

buywise:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-120b}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    timeout-seconds: 35
    max-retries: 3
    retry-delay-ms: 1000
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  demo:
    seed-on-startup: true
    default-currency: MAD

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
