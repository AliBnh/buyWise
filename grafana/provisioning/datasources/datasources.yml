# ==============================================================================================
# GRAFANA AUTOMATED DATASOURCE PROVISIONING
# ==============================================================================================
# Eliminates manual UI configuration in Grafana by declaratively wiring Prometheus
# via the internal Docker bridge network hostname (http://prometheus:9090).
# ==============================================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Internal Docker network address of the Prometheus server
    url: http://prometheus:9090
    isDefault: true
    # Prevents runtime tampering via Grafana UI in production
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
