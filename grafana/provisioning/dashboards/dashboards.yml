# ==============================================================================================
# GRAFANA AUTOMATED DASHBOARD PROVISIONING
# ==============================================================================================
# Automatically mounts and loads pre-built dashboard JSON definitions on startup from
# /var/lib/grafana/dashboards (mapped to local ./grafana/dashboards in docker-compose).
# ==============================================================================================

apiVersion: 1

providers:
  - name: 'BuyWise Dashboards'
    orgId: 1
    folder: 'BuyWise Platform'
    folderUid: 'buywise'
    type: file
    # Prevents accidental deletion of system dashboards from UI
    disableDeletion: true
    # Scans for dashboard updates every 10 seconds without needing container restart
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
